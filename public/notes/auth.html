  <script>
    export default async ({ load }) => {
      const store = await load("./store.js");

      return {
        data: {
          mode: "login",
          username: "",
          password: "",
          confirmPassword: "",
          showPassword: false,
          errorMessage: "",
          successMessage: "",
          errors: {},
          isDark: false,
        },
        proto: {
          switchMode(mode) {
            this.mode = mode;
            this.errorMessage = "";
            this.successMessage = "";
            this.errors = {};
            this.password = "";
            this.confirmPassword = "";
          },
          togglePassword() {
            this.showPassword = !this.showPassword;
          },
          toggleTheme() {
            const dark = document.documentElement.getAttribute("data-theme") === "dark";
            if (dark) {
              document.documentElement.removeAttribute("data-theme");
            } else {
              document.documentElement.setAttribute("data-theme", "dark");
            }
            localStorage.setItem("note-app.theme", dark ? "light" : "dark");
            this.isDark = !dark;
          },
          handleKeydown(e) {
            if (e.key === "Enter") this.submit();
          },
          submit() {
            if (this.mode === "login") this.doLogin();
            else this.doRegister();
          },
          async doLogin() {
            const errors = {};
            if (!this.username.trim()) errors.username = "请输入用户名";
            if (!this.password) errors.password = "请输入密码";
            if (Object.keys(errors).length) {
              this.errors = errors;
              this.errorMessage = "请检查表单填写是否正确";
              return;
            }
            this.errorMessage = "";
            this.successMessage = "";
            const res = await store.login(this.username.trim(), this.password);
            if (!res.ok) {
              this.errorMessage = res.message;
              return;
            }
            this.app.goto("./main.html");
          },
          async doRegister() {
            const errors = {};
            const name = this.username.trim();
            if (name.length < 2) {
              errors.username = "用户名至少 2 个字符";
            }
            if (this.password.length < 6) {
              errors.password = "密码至少 6 位";
            }
            if (this.confirmPassword !== this.password) {
              errors.confirmPassword = "两次输入的密码不一致";
            }
            if (Object.keys(errors).length) {
              this.errors = errors;
              this.errorMessage = "请检查表单填写是否正确";
              return;
            }
            this.errorMessage = "";
            const res = await store.register(name, this.password);
            if (!res.ok) {
              this.errorMessage = res.message;
              return;
            }
            // 后端注册不返回 token，注册成功后切换到登录模式
            this.successMessage = "注册成功，请登录";
            this.mode = "login";
            this.password = "";
            this.confirmPassword = "";
          },
        },
        async ready() {
          // 已登录且 token 有效时直接进入主界面
          if (store.isLoggedIn()) {
            const me = await store.fetchMe();
            if (me) {
              this.app.replace("./main.html");
              return;
            }
            store.logout(); // token 无效则清除
          }
          this.isDark = document.documentElement.getAttribute("data-theme") === "dark";
        },
      };
    };
  </script>
