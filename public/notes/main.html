          <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/>
        </svg>
        <input type="text" sync:value="searchText" placeholder="搜索标题或内容...">
      </div>

      <button class="new-btn" on:click="addNote">
        <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
          <path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/>
        </svg>
        新建笔记
      </button>

      <div class="list-area">
        <o-fill :value="noteGroups">
          <div class="note-group">
            <button class="group-head" on:click="$host.toggleGroup($data.key)" attr:aria-expanded="!$host.isGroupCollapsed($data.key)">
              <span class="group-title">{{$data.key}}</span>
              <span class="group-count">{{$data.items.length}}</span>
              <svg class="group-arrow" class:open="!$host.isGroupCollapsed($data.key)" width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                <path d="M101.66,50a8,8,0,0,1,0,11.32L67.31,96l34.35,34.34a8,8,0,0,1-11.32,11.32l-40-40a8,8,0,0,1,0-11.32l40-40A8,8,0,0,1,101.66,50Z"/>
              </svg>
            </button>
            <o-if :value="!$host.isGroupCollapsed($data.key)">
              <o-fill :value="$data.items">
                <div class="note-item" class:active="$data.id === $host.currentId" on:click="$host.openNote($data.id)">
                  <div class="note-item-title">{{$data.title || '无标题'}}</div>
                  <div class="note-item-meta">{{$host.formatTime($data.updateTime)}}</div>
                  <div class="note-item-preview">{{$data.content}}</div>

              </o-fill>
            </o-if>
          </div>
        </o-fill>
        <o-if :value="noteList.length === 0 && searchText">
          <div class="empty-tip">
            <svg width="36" height="36" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"/>
            </svg>
            <p>未找到与「{{searchText}}」匹配的笔记</p>
            <button on:click="clearSearch">清除搜索</button>
          </div>
        </o-if>
        <o-if :value="noteList.length === 0 && !searchText">
          <div class="empty-tip">
            <svg width="36" height="36" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path d="M88,96a8,8,0,0,1,8-8h64a8,8,0,0,1,0,16H96A8,8,0,0,1,88,96Zm8,40h64a8,8,0,0,0,0-16H96a8,8,0,0,0,0,16Zm32,16H96a8,8,0,0,0,0,16h32a8,8,0,0,0,0-16ZM224,48V156.69A15.86,15.86,0,0,1,219.31,168L168,219.31A15.86,15.86,0,0,1,156.69,224H48a16,16,0,0,1-16-16V48A16,16,0,0,1,48,32H208A16,16,0,0,1,224,48ZM48,208H152V160a8,8,0,0,1,8-8h48V48H48Zm120-40v28.7L196.69,168Z"/>
            </svg>
            <p>还没有笔记，创建第一篇吧</p>
            <button on:click="addNote">新建笔记</button>
          </div>
        </o-if>
      </div>

      <div class="sidebar-footer">
        <span class="user-name">
          <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
            <path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"/>
          </svg>
          {{username}}
        </span>
        <button class="logout-btn" on:click="logout">
          <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
            <path d="M120,216a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V40a8,8,0,0,1,8-8h64a8,8,0,0,1,0,16H56V208h56A8,8,0,0,1,120,216Zm109.66-93.66-40-40a8,8,0,0,0-11.32,11.32L204.69,120H112a8,8,0,0,0,0,16h92.69l-26.35,26.34a8,8,0,0,0,11.32,11.32l40-40A8,8,0,0,0,229.66,122.34Z"/>
          </svg>
          退出
        </button>
      </div>
    </aside>

    <!-- ===== 编辑器 ===== -->
    <main class="editor">
      <o-if :value="!currentNote">
        <div class="editor-empty">
          <svg width="44" height="44" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
            <path d="M232,48H160a40,40,0,0,0-32,16A40,40,0,0,0,96,48H24a8,8,0,0,0-8,8V200a8,8,0,0,0,8,8H96a24,24,0,0,1,24,24,8,8,0,0,0,16,0,24,24,0,0,1,24-24h72a8,8,0,0,0,8-8V56A8,8,0,0,0,232,48ZM96,192H32V64H96a24,24,0,0,1,24,24V200A39.81,39.81,0,0,0,96,192Zm128,0H160a39.81,39.81,0,0,0-24,8V88a24,24,0,0,1,24-24h64Z"/>
          </svg>
          <p>选择一篇笔记开始阅读<br>或新建一篇笔记</p>
        </div>
      </o-if>
      <o-else>
        <div class="editor-head">
          <button class="back-btn" on:click="backToList" attr:title="'返回列表'">
            <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/>
            </svg>
          </button>
          <span class="created-time">
            <svg width="14" height="14" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z"/>
            </svg>
            创建于 {{createdText}}
          </span>
          <button class="save-btn" class:saved="!isDirty" class:dirty="isDirty" on:click="saveNote" attr:disabled="!isDirty" attr:title="isDirty ? '保存 (Ctrl+S)' : '已保存'">
            <o-if :value="isDirty">
              <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                <path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48ZM216,192H40V64H80v40a8,8,0,0,0,8,8h80a8,8,0,0,0,8-8V64h40ZM96,64h64V96H96Z"/>
              </svg>
              保存
            </o-if>
            <o-else>
              <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                <path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"/>
              </svg>
              已保存
            </o-else>
          </button>
          <button class="danger-btn" on:click="askDelete">
            <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
              <path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/>
            </svg>
            删除
          </button>
        </div>
        <div class="editor-body">
          <input class="title-input" type="text" sync:value="title" placeholder="无标题">
          <div class="md-toolbar" role="tablist" attr:aria-label="'编辑器模式'">
            <button class="md-tab" class:active="mdMode === 'edit'" on:click="switchMdMode('edit')">编辑</button>
            <button class="md-tab" class:active="mdMode === 'preview'" on:click="switchMdMode('preview')">预览</button>
            <button class="md-tab md-tab-split" class:active="mdMode === 'split'" on:click="switchMdMode('split')">分屏</button>
          </div>
          <div class="md-content">
            <textarea class="content-input" class:hidden="mdMode === 'preview'" sync:value="content" placeholder="开始书写……（支持 Markdown 语法）"></textarea>
            <div class="md-preview" class:hidden="mdMode === 'edit'" :html="previewHtml"></div>
          </div>
          <div class="fmt-toolbar" class:hidden="mdMode === 'preview'" role="toolbar" attr:aria-label="'格式工具栏'">
            <button class="fmt-btn" on:click="applyFormat('h1')" attr:title="'一级标题'">H1</button>
            <button class="fmt-btn" on:click="applyFormat('h2')" attr:title="'二级标题'">H2</button>
            <button class="fmt-btn" on:click="applyFormat('h3')" attr:title="'三级标题'">H3</button>
            <span class="fmt-sep"></span>
            <button class="fmt-btn" on:click="applyFormat('bold')" attr:title="'加粗 (Ctrl+B)'"><b>B</b></button>
            <button class="fmt-btn" on:click="applyFormat('italic')" attr:title="'斜体 (Ctrl+I)'"><i>I</i></button>
            <span class="fmt-sep"></span>
            <button class="fmt-btn" on:click="applyFormat('ul')" attr:title="'无序列表'">• 列表</button>
            <button class="fmt-btn" on:click="applyFormat('quote')" attr:title="'引用'">引用</button>
            <button class="fmt-btn" on:click="applyFormat('code')" attr:title="'行内代码'">&lt;/&gt; 代码</button>
            <span class="fmt-sep"></span>
            <button class="fmt-btn" on:click="applyFormat('link')" attr:title="'插入链接 (Ctrl+K)'">链接</button>
            <button class="fmt-btn" on:click="applyFormat('image')" attr:title="'插入图片链接'">图片</button>
          </div>
          <div class="editor-stats">
            <span>{{stats.chars}} 字</span>
            <span>·</span>
            <span>约 {{stats.minutes}} 分钟阅读</span>
          </div>
        </div>
      </o-else>
    </main>
  </div>

  <!-- ===== 删除确认层 ===== -->
  <o-if :value="confirmOpen">
    <div class="overlay" on:click="cancelDelete">
      <div class="confirm-card" on:click="stopProp($event)">
        <h3>删除这篇笔记？</h3>
        <p>「{{pendingTitle}}」删除后将无法恢复</p>
        <div class="confirm-actions">
          <button class="ghost-btn" on:click="cancelDelete">取消</button>
          <button class="danger-solid-btn" on:click="confirmDelete">删除</button>
        </div>
      </div>
    </div>
  </o-if>

  <!-- ===== 未保存修改确认层 ===== -->
  <o-if :value="dirtyConfirmOpen">
    <div class="overlay" on:click="_cancelDirtyDiscard">
      <div class="confirm-card" on:click="stopProp($event)">
        <h3>有未保存的修改</h3>
        <p>当前笔记的修改尚未保存，切换后将丢失这些修改</p>
        <div class="confirm-actions">
          <button class="ghost-btn" on:click="_cancelDirtyDiscard">取消</button>
          <button class="danger-solid-btn" on:click="_confirmDirtyDiscard">放弃修改</button>
        </div>
      </div>
    </div>
  </o-if>

  <script>
    export default async ({ load }) => {
      const store = await load("./store.js");

      return {
        data: {
          username: "",
          searchText: "",
          noteList: [],
          noteGroups: [],
          collapsedGroups: (() => {
            try {
              return JSON.parse(localStorage.getItem("note-app.collapsed-groups") || "{}");
            } catch {
              return {};
            }
          })(),
          currentId: "",
          currentNote: null,
          title: "",
          content: "",
          createdText: "",
          editorVisible: false,
          confirmOpen: false,
          pendingDeleteId: "",
          pendingTitle: "",
          isDark: false,
          isDirty: false,
          _savedTitle: "",
          _savedContent: "",
          dirtyConfirmOpen: false,
          mdMode: "edit",
          previewHtml: "",
          stats: { chars: 0, minutes: 1 },
        },
        proto: {
          async refreshList() {
            try {
              this.noteList = await store.getMyNotes(this.searchText.trim());
              const searchMode = !!this.searchText.trim();
              const groups = this.groupNotes(this.noteList);
              // 未记录偏好的组：搜索时全部展开，否则仅第一组默认展开
              const next = { ...this.collapsedGroups };
              groups.forEach((g, i) => {
                if (!(g.key in next)) next[g.key] = searchMode ? false : i > 0;
              });
              // 当前打开的笔记所在组强制展开，避免编辑中的笔记在列表中“消失”
              const current = this.noteList.find((n) => n.id === this.currentId);
              if (current) next[this.groupKeyOf(current.updateTime)] = false;
              this.collapsedGroups = next;
              this.noteGroups = groups;
            } catch (e) {
              this.handleError(e);
            }
          },
          // 按时间分组：今天 / 近3天 / 近7天 / 近30天 / 更早
          groupKeyOf(ts) {
            const d = new Date(ts);
            const startOfDay = (v) => {
              const t = new Date(v);
              return new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
            };
            const diffDays = Math.round((startOfDay(Date.now()) - startOfDay(d)) / 86400000);
            if (diffDays <= 0) return "今天";
            if (diffDays <= 3) return "近3天";
            if (diffDays <= 7) return "近7天";
            if (diffDays <= 30) return "近30天";
            return "更早";
          },
          groupNotes(list) {
            const order = ["今天", "近3天", "近7天", "近30天", "更早"];
            return order
              .map((key) => ({ key, items: list.filter((n) => this.groupKeyOf(n.updateTime) === key) }))
              .filter((g) => g.items.length > 0);
          },
          toggleGroup(key) {
            this.collapsedGroups = { ...this.collapsedGroups, [key]: !this.collapsedGroups[key] };
            localStorage.setItem("note-app.collapsed-groups", JSON.stringify(this.collapsedGroups));
          },
          isGroupCollapsed(key) {
            return !!this.collapsedGroups[key];
          },
          formatTime(ts) {
            return store.formatTime(ts);
          },
          openNote(id) {
            // 有未保存修改时，先提示用户
            if (this.isDirty && this.currentId !== id) {
              this._pendingOpenId = id;
              this._showDirtyConfirm();
              return;
            }
            this._doOpenNote(id);
          },
          _doOpenNote(id) {
            const note = this.noteList.find((n) => n.id === id);
            if (!note) return;
            this.currentId = id;
            this.currentNote = note;
            // 记录已保存快照：打开笔记的赋值不标记为 dirty
            this._savedTitle = note.title;
            this._savedContent = note.content;
            this.title = note.title;
            this.content = note.content;
            this.isDirty = false;
            this.mdMode = "preview";
            this.createdText = store.formatTime(note.updateTime);
            this.editorVisible = true;
            this.renderPreview();
            this.updateStats();
          },
          switchMdMode(mode) {
            // 窄屏不支持分屏，自动降级为预览
            if (mode === "split" && window.innerWidth < 768) mode = "preview";
            this.mdMode = mode;
            this.renderPreview();
          },
          escapeHtml(src) {
            return src
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;");
          },
          renderPreview() {
            if (!window.marked) {
              this.previewHtml = "<p>Markdown 解析器未加载</p>";
              return;
            }
            // 先转义 HTML 标签，再解析 Markdown，防止注入
            const escaped = this.escapeHtml(this.content || "");
            let html = window.marked.parse(escaped, { breaks: true, gfm: true });
            // 清理危险协议链接
            html = html.replace(/(href|src)="javascript:[^"]*"/gi, '$1="#"');
            this.previewHtml = html;
          },
          // ===== 格式工具栏 =====
          applyFormat(kind) {
            // 页面内容渲染在 o-page 的 shadow DOM 中：this.ele 为真实元素，shadowRoot 内查询
            const ta = this.ele.shadowRoot.querySelector(".content-input");
            if (!ta) return;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const val = this.content || "";
            const selected = val.slice(start, end);

            // 行级格式：作用于光标所在行，支持 toggle
            const blockKinds = { h1: "# ", h2: "## ", h3: "### ", ul: "- ", quote: "> " };
            if (blockKinds[kind]) {
              this.toggleLinePrefix(blockKinds[kind], ta, start, end);
              return;
            }

            let insert = "";
            let selStart = start;
            let selEnd = end;
            switch (kind) {
              case "bold": {
                const t = selected || "粗体文字";
                insert = `**${t}**`;
                selStart = start + 2;
                selEnd = selStart + t.length;
                break;
              }
              case "italic": {
                const t = selected || "斜体文字";
                insert = `*${t}*`;
                selStart = start + 1;
                selEnd = selStart + t.length;
                break;
              }
              case "code": {
                if (selected.includes("\n")) {
                  const t = selected || "代码";
                  insert = `\`\`\`\n${t}\n\`\`\``;
                  selStart = start + 4;
                  selEnd = selStart + t.length;
                } else {
                  const t = selected || "代码";
                  insert = `\`${t}\``;
                  selStart = start + 1;
                  selEnd = selStart + t.length;
                }
                break;
              }
              case "link": {
                const text = selected || "链接文字";
                insert = `[${text}](https://)`;
                selStart = start + text.length + 3; // 光标落在 url 处
                selEnd = selStart + 8; // 选中 https:// 便于直接输入
                break;
              }
              case "image": {
                const alt = selected || "图片描述";
                insert = `![${alt}](https://)`;
                selStart = start + alt.length + 4; // 光标落在 url 处
                selEnd = selStart + 8; // 选中 https:// 便于直接输入
                break;
              }
            }
            this.content = val.slice(0, start) + insert + val.slice(end);
            this.restoreSelection(ta, selStart, selEnd);
          },
          toggleLinePrefix(prefix, ta, start, end) {
            const val = this.content || "";
            const lineStart = val.lastIndexOf("\n", start - 1) + 1;
            let lineEnd = val.indexOf("\n", end);
            if (lineEnd === -1) lineEnd = val.length;
            const lineText = val.slice(lineStart, lineEnd);
            const newLine = lineText.startsWith(prefix) ? lineText.slice(prefix.length) : prefix + lineText;
            this.content = val.slice(0, lineStart) + newLine + val.slice(lineEnd);
            const offset = newLine.length - lineText.length;
            this.restoreSelection(ta, start + offset, end + offset);
          },
          restoreSelection(ta, s, e) {
            requestAnimationFrame(() => {
              ta.focus();
              ta.setSelectionRange(s, e);
            });
          },
          // ===== 快捷键 =====
          handleShortcut(e) {
            if (this.mdMode === "preview") return;
            const ta = this.ele.shadowRoot.querySelector(".content-input");
            if (!ta) return;
            // shadow DOM 中 document.activeElement 是宿主元素，用 :focus 匹配判断
            if (!ta.matches(":focus")) return;
            if (e.key === "Tab") {
              e.preventDefault();
              const start = ta.selectionStart;
              this.content = (this.content || "").slice(0, start) + "  " + (this.content || "").slice(ta.selectionEnd);
              this.restoreSelection(ta, start + 2, start + 2);
              return;
            }
            if (!(e.ctrlKey || e.metaKey)) return;
            const k = e.key.toLowerCase();
            if (k === "s") {
              e.preventDefault();
              this.saveNote();
            } else if (k === "b") {
              e.preventDefault();
              this.applyFormat("bold");
            } else if (k === "i") {
              e.preventDefault();
              this.applyFormat("italic");
            } else if (k === "k") {
              e.preventDefault();
              this.applyFormat("link");
            }
          },
          // ===== 字数统计 =====
          updateStats() {
            const chars = (this.content || "").replace(/\s/g, "").length;
            this.stats.chars = chars;
            this.stats.minutes = Math.max(1, Math.ceil(chars / 300));
          },
          addNote() {
            // 有未保存修改时，先提示用户
            if (this.isDirty) {
              this._pendingAddNote = true;
              this._showDirtyConfirm();
              return;
            }
            this._doAddNote();
          },
          _doAddNote() {
            // 打开本地草稿，待用户手动保存时创建
            this.currentId = "";
            this.currentNote = { id: "", title: "", content: "", updateTime: Date.now() };
            this._savedTitle = "";
            this._savedContent = "";
            this.title = "";
            this.content = "";
            this.isDirty = false;
            this.createdText = "尚未保存";
            this.editorVisible = true;
            this.renderPreview();
            this.updateStats();
          },
          // 手动保存
          async saveNote() {
            if (!this.isDirty) return;
            if (!this.title.trim() || !this.content.trim()) {
              this.showToast("标题和内容不能为空", "error");
              return;
            }
            try {
              if (this.currentId) {
                await store.updateNote(this.currentId, { title: this.title, content: this.content });
              } else {
                const note = await store.createNote(this.title, this.content);
                if (note) {
                  this.currentId = note.id;
                  this.currentNote = note;
                  this.createdText = store.formatTime(note.updateTime);
                }
                this.refreshList();
              }
              // 保存成功后更新快照，标记已保存
              this._savedTitle = this.title;
              this._savedContent = this.content;
              this.isDirty = false;
              this.showToast("已保存", "success");
            } catch (e) {
              this.handleError(e);
            }
          },
          // 检查是否有未保存修改（仅在编辑笔记时）
          checkDirty() {
            if (!this.currentNote) return;
            this.isDirty = this.title !== this._savedTitle || this.content !== this._savedContent;
          },
          // 未保存修改确认
          _showDirtyConfirm() {
            this.dirtyConfirmOpen = true;
          },
          _confirmDirtyDiscard() {
            this.dirtyConfirmOpen = false;
            this.isDirty = false;
            // 还原当前笔记的 title/content 到保存前的快照
            if (this.currentNote) {
              this.currentNote.title = this._savedTitle;
              this.currentNote.content = this._savedContent;
            }
            this.title = this._savedTitle;
            this.content = this._savedContent;
            if (this._pendingOpenId) {
              const id = this._pendingOpenId;
              this._pendingOpenId = null;
              this._doOpenNote(id);
            } else if (this._pendingAddNote) {
              this._pendingAddNote = false;
              this._doAddNote();
            }
          },
          _cancelDirtyDiscard() {
            this.dirtyConfirmOpen = false;
            this._pendingOpenId = null;
            this._pendingAddNote = false;
          },
          handleError(e) {
            const msg = (e && e.message) || "操作失败";
            // token 失效或未登录时回到登录页
            if (/未登录|token|登录/.test(msg)) {
              store.logout();
              this.app.replace("./auth.html");
              return;
            }
            this.showToast(msg, "error");
          },
          showToast(msg, type = "info") {
            let box = this.ele.shadowRoot.querySelector(".toast-box");
            if (!box) {
              box = document.createElement("div");
              box.className = "toast-box";
              this.ele.shadowRoot.appendChild(box);
            }
            const t = document.createElement("div");
            t.className = "toast " + type;
            t.textContent = msg;
            box.appendChild(t);
            setTimeout(() => t.remove(), 3000);
          },
          clearSearch() {
            this.searchText = "";
          },
          backToList() {
            this.editorVisible = false;
          },
          askDelete() {
            if (!this.currentNote) return;
            this.pendingDeleteId = this.currentId;
            this.pendingTitle = this.currentNote.title || "无标题";
            this.confirmOpen = true;
          },
          async confirmDelete() {
            const id = this.pendingDeleteId;
            this.confirmOpen = false;
            // 未保存的草稿直接丢弃，无需调用接口
            if (id) {
              try {
                await store.deleteNote(id);
              } catch (e) {
                this.handleError(e);
                return;
              }
            }
            this.currentId = "";
            this.currentNote = null;
            this._savedTitle = "";
            this._savedContent = "";
            this.isDirty = false;
            this.title = "";
            this.content = "";
            this.createdText = "";
            this.previewHtml = "";
            this.stats.chars = 0;
            this.stats.minutes = 1;
            this.refreshList();
          },
          cancelDelete() {
            this.confirmOpen = false;
          },
          stopProp(e) {
            e.stopPropagation();
          },
          toggleTheme() {
            const dark = document.documentElement.getAttribute("data-theme") === "dark";
            if (dark) {
              document.documentElement.removeAttribute("data-theme");
            } else {
              document.documentElement.setAttribute("data-theme", "dark");
            }
            localStorage.setItem("note-app.theme", dark ? "light" : "dark");
            this.isDark = !dark;
          },
          logout() {
            store.logout();
            this.app.replace("./auth.html");
          },
        },
        watch: {
          searchText() {
            clearTimeout(this._searchTimer);
            this._searchTimer = setTimeout(() => this.refreshList(), 300);
          },
          title() {
            if (this.currentNote) this.currentNote.title = this.title;
            this.checkDirty();
          },
          content() {
            if (this.currentNote) this.currentNote.content = this.content;
            if (this.mdMode !== "edit") this.renderPreview();
            this.updateStats();
            this.checkDirty();
          },
          confirmOpen(open) {
            if (open) {
              this._escHandler = (e) => {
                if (e.key === "Escape") this.cancelDelete();
              };
              document.addEventListener("keydown", this._escHandler);
            } else if (this._escHandler) {
              document.removeEventListener("keydown", this._escHandler);
              this._escHandler = null;
            }
          },
        },
        async ready() {
          if (!store.isLoggedIn()) {
            this.app.replace("./auth.html");
            return;
          }
          // 校验 token 并获取当前用户
          const me = await store.fetchMe();
          if (!me) {
            store.logout();
            this.app.replace("./auth.html");
            return;
          }
          this.username = me.username;
          this.isDark = document.documentElement.getAttribute("data-theme") === "dark";
          await this.refreshList();
          // 注册编辑器快捷键（Ctrl+B / Ctrl+I / Ctrl+K / Ctrl+S / Tab）
          this._shortcutHandler = (e) => this.handleShortcut(e);
          document.addEventListener("keydown", this._shortcutHandler);
          // 离开页面时提示未保存修改
          this._beforeUnloadHandler = (e) => {
            if (this.isDirty) {
              e.preventDefault();
              e.returnValue = "";
            }
          };
          window.addEventListener("beforeunload", this._beforeUnloadHandler);
        },
        detached() {
          if (this._escHandler) {
            document.removeEventListener("keydown", this._escHandler);
            this._escHandler = null;
          }
          if (this._shortcutHandler) {
            document.removeEventListener("keydown", this._shortcutHandler);
            this._shortcutHandler = null;
          }
          if (this._searchTimer) {
            clearTimeout(this._searchTimer);
            this._searchTimer = null;
          }
          if (this._beforeUnloadHandler) {
            window.removeEventListener("beforeunload", this._beforeUnloadHandler);
            this._beforeUnloadHandler = null;
          }
        },
      };
    };
  </script>
</template>
