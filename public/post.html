<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post</title>
  <link rel="stylesheet" href="/css/webix.min.css" type="text/css">
</head>
<body>
<script src="/js/webix.min.js" type="text/javascript"></script>
<script>
    // API请求封装：自动处理 token 续期
    async function api(method, url, data) {
        const headers = {token: window.localStorage.getItem("token")}
        if (data !== undefined) {
            headers["Content-type"] = "application/json"
        }
        let response
        if (method === 'GET') {
            response = await webix.ajax().headers(headers).get(url)
        } else if (method === 'POST') {
            response = await webix.ajax().headers(headers).post(url, JSON.stringify(data))
        } else if (method === 'PUT') {
            response = await webix.ajax().headers(headers).put(url, JSON.stringify(data))
        } else if (method === 'DELETE') {
            response = await webix.ajax().headers(headers).del(url)
        }
        // 自动续期：检查响应头中的新token
        const newToken = response.headers && response.headers['x-new-token']
        if (newToken) {
            window.localStorage.setItem('token', newToken)
        }
        return response.json()
    }

    webix.ready(async function() {
        webix.ui({
            view:"window",
            id:"insert_window",
            head:"新增",
            close:true,
            position: "center",
            body: {
                view:"form",
                id:"insert_form",
                elements:[
                    {view:"text", name:"title", label:"标题"},
                    {view:"textarea", name:"body",width:600, height:200, label:"内容"},
                    {view:"button", value:"提交", click:async function () {
                            const params = this.getParentView().getValues()
                            const json = await api("POST", "/api/post", params)
                            if (json.code !== 200) {
                                webix.alert(json.msg)
                                return [];
                            } else {
                                this.getParentView().hide();
                                webix.message("新增成功");
                                loadData()
                            }
                        }}
                ]
            }
        });
        webix.ui({
            view:"window",
            id:"edit_window",
            head:"修改",
            close:true,
            position: "center",
            body: {
                view:"form",
                id:"edit_form",
                elements:[
                    {view:"text", name:"title", label:"标题"},
                    {view:"textarea", name:"body",width:600, height:200, label:"内容"},
                    {view:"button", value:"提交", click:async function () {
                            var values = this.getParentView().getValues();
                            const json = await api("PUT", "/api/post/"+values.id, {title:values.title,body:values.body})
                            if (json.code !== 200) {
                                webix.alert(json.msg)
                            }else{
                                this.getParentView().hide();
                                webix.message("修改成功");
                                loadData()
                            }
                        }}
                ]
            }
        });
        webix.ui({
            view: "window",
            id: "detail_window",
            position: "center",
            head: "文章详情",
            body: {
                view: "form",
                id: "detailForm",
                elements: [
                    { view: "text", name: "title", label: "标题", readonly: true },
                    { view: "textarea", name: "body", label: "内容",width:600, height:200, readonly: true },
                    {
                        margin: 10,
                        cols: [
                            { view: "button", value: "关闭", click: () => $$("detail_window").hide() }
                        ]
                    }
                ]
            }
        });
        async function loadData(keyword = "") {
            let url = "/api/post";
            if (keyword) {
                url = `/api/post?keyword=${encodeURIComponent(keyword)}`;
            }
            const res = await api("GET", url)
            if (res.code !== 200) {
                await webix.alert(res.msg);
                window.location.href="/login"
            } else {
                $$("mytable").parse(res.data,"json",true);
            }
        }

        async function loadUserInfo() {
            try {
                const res = await api("GET", "/api/user/me")
                if (res.code !== 200) {
                    window.location.href="/login"
                    return
                }
                const user = res.data
                const roleText = user.role === 'admin' ? '管理员' : '普通用户'
                document.getElementById('user-badge').innerHTML =
                    '<i class="fa fa-user mr-1"></i>' + user.username + ' (' + roleText + ') ' +
                    '<a href="javascript:void(0)" onclick="logout()" style="margin-left:10px;color:#3374e0;text-decoration:underline">注销</a>'
            } catch (error) {
                window.location.href="/login"
            }
        }
        window.logout = function() {
            window.localStorage.removeItem("token");
            window.location.href="/login";
        }
        
        async function searchData() {
            const keyword = $$("searchInput").getValue();
            await loadData(keyword);
        }
        const datatable = {
            id: "mytable",
            view:"datatable",
            autoheight:true,
            minHeight:400,
            autowidth:true,
            scroll:false,
            select:true,
            columns: [
                {id: "id", header: "id", width: 50},
                {id: "title", header: "标题", width: 200,editor: "text"},
                {id: "author", header: "作者", width: 100},
                {id: "body", header: "内容", width: 500,editor: "text"},
                {id: "update_time", header: "创建时间", width: 150, template:function(obj){return new Date(obj.update_time).toLocaleString()}}
            ],
            on:{
                onItemDblClick:function (id, e, node){
                    const item = this.getItem(id);
                    if (item) {
                        // 填充表单数据
                        $$("detailForm").setValues(item);
                        // 显示详情窗口
                        $$("detail_window").show();
                    }
                }
            },
            pager:"pager"
        };
        webix.ui({
            css:{
                margin:"50px auto",
            },
            width: 1000,
            rows: [
                {type: "header", id:"page_header", template:"<div style='display:flex;justify-content:space-between;align-items:center;width:100%'><span style='font-size:35px'>lxy记录</span><span id='user-badge' style='font-size:14px;font-weight:normal'></span></div>"},
                {
                    view:"toolbar",
                    cols:[
                        {view:"button", value:"新增",width:100, click:function(){$$("insert_window").show()}},
                        {
                            view:"button",
                            value:"修改",
                            width:100,
                            click:function(){
                                const selected = $$("mytable").getSelectedItem();
                                if (selected) {
                                    $$("edit_form").setValues(selected);
                                    $$("edit_window").show();
                                } else {
                                    webix.alert("请选择要修改的行");
                                }
                            }
                        },
                        {
                            view:"button",
                            value:"删除",
                            width:100,
                            click:function(){
                                const selected = $$("mytable").getSelectedItem();
                                if (!selected) {
                                    webix.alert("请选择要删除的行");
                                    return;
                                }
                                webix.confirm("确定删除该文章吗？", async (result) => {
                                    if (!result) return;
                                    const json = await api("DELETE", "/api/post/"+selected.id)
                                    if (json.code !== 200) {
                                        webix.alert(json.msg)
                                    } else {
                                        webix.message("删除成功");
                                        loadData()
                                    }
                                });
                            }
                        },
                        {},
                        { view:"text", id:"searchInput", placeholder:"输入标题搜索", width:200 },
                        { view:"button", value:"搜索", width:80, click:function(){ searchData() } },
                        { view:"button", value:"重置", width:80, click:function(){ $$("searchInput").setValue(""); loadData() } }
                    ]
                },
                datatable,
                {
                    view:"pager",
                    id:"pager",
                    size:10,
                    group:5,
                    template: "{common.first()} {common.prev()} {common.pages()} {common.next()} {common.last()}"
                }
            ]
        });
        loadUserInfo();
        loadData();
    })
</script>
</body>
</html>
